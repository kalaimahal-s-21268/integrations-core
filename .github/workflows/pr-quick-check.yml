name: Quick check PR

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  CHECK_SCRIPT: "ddev/src/ddev/utils/scripts/check_pr.py"

# Use restritive workflow permissions. See https://datadoghq.atlassian.net/wiki/spaces/SECENG/pages/3913581900/GitHub+Workflow+Token+Permissions+GITHUB_TOKEN#Approach-1%3A-Bottom-up-%E2%A4%B4%EF%B8%8F
permissions:
  contents: read
  packages: read

jobs:
  check:
    name: Check PR
    runs-on: ubuntu-22.04

    steps:
    # Uncomment for testing purposes
    # - uses: actions/checkout@v4
    #   if: inputs.repo == 'core'
    #   with:
    #     ref: "${{ github.event.pull_request.head.sha }}"

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: "${{ env.PYTHON_VERSION }}"



    - name: Fetch script
      # Uncomment for testing purposes
      # if: inputs.repo != 'core'
      run: |-
        mkdir -p $(dirname ${{ env.CHECK_SCRIPT }})
        curl -sLo ${{ env.CHECK_SCRIPT }} https://raw.githubusercontent.com/DataDog/integrations-core/master/${{ env.CHECK_SCRIPT }}

    - name: Check changelog
      run: >-
        python ${{ env.CHECK_SCRIPT }} changelog
        --diff-file /tmp/diff
        --pr-file "$GITHUB_EVENT_PATH"
        ${{ github.event.pull_request.base.repo.private && '--private' || '' }}
        --repo "${{ inputs.repo }}"

    - uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          major_bump_fragments:
            - '*/changelog.d/*.changed'
            - '*/changelog.d/*.removed'
            - '*/changelog.d/*.major'

    - name: Create token
      uses: actions/create-github-app-token@v1
      id: token-generator
      with:
        app-id: ${{ secrets.DD_AGENT_INTEGRATIONS_BOT_APP_ID }}
        private-key: ${{ secrets.DD_AGENT_INTEGRATIONS_BOT_PRIVATE_KEY }}
        repositories: integrations-core

    - name: Comment
      if: ${{ steps.changes.outputs.major_bump_fragments == 'true' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ steps.token-generator.outputs.token }}
        script: |
          const { issue: { number: issue_number }, repo: { owner, repo }  } = context;
          github.rest.issues.createComment({ issue_number, owner, repo, body: "The changelog type `changed` or `removed` was used in this Pull Request, so the next release will bump major version. Please make sure this is a breaking change, or use the `fixed` or `added` type instead." });
