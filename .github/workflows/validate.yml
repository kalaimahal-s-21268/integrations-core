name: Validate repository

on:
  push:
    branches:
    - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Use restritive workflow permissions. See https://datadoghq.atlassian.net/wiki/spaces/SECENG/pages/3913581900/GitHub+Workflow+Token+Permissions+GITHUB_TOKEN#Approach-1%3A-Bottom-up-%E2%A4%B4%EF%B8%8F
permissions:
  contents: read
  packages: read
  
jobs:
  run:
    uses: ./.github/workflows/run-validations.yml
    with:
      repo: core

      # Validations
      agent-reqs: true
      ci: true
      codeowners: true
      config: true
      dashboards: true
      dep: true
      http: true
      imports: true
      integration-style: true
      jmx-metrics: true
      labeler: true
      legacy-signature: true
      license-headers: true
      licenses: true
      metadata: true
      models: true
      openmetrics: true
      package: true
      readmes: true
      saved-views: true
      service-checks: true
      version: true
    secrets: inherit
