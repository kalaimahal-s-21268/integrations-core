# https://github.com/actions/labeler

name: Community PR Labels
on:
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - review_requested

# Use restritive workflow permissions. See https://datadoghq.atlassian.net/wiki/spaces/SECENG/pages/3913581900/GitHub+Workflow+Token+Permissions+GITHUB_TOKEN#Approach-1%3A-Bottom-up-%E2%A4%B4%EF%B8%8F
permissions:
  contents: read
  packages: read
  
jobs:
  labeler:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }} # only PRs from other repos
    uses: ./.github/workflows/labeler-reusable.yml
    secrets:
      app-id: "${{ secrets.DD_AGENT_INTEGRATIONS_BOT_APP_ID }}"
      private-key: "${{ secrets.DD_AGENT_INTEGRATIONS_BOT_PRIVATE_KEY }}"