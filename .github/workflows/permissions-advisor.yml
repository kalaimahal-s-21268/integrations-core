# TODO DELETEME: Restore before merging
name: Check App Token Permissions
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  check_token_creation:
    name: Check App Token Creation with Read Permissions
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Attempt to Create GitHub App Token
        id: token-generator
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DD_AGENT_INTEGRATIONS_BOT_APP_ID }}
          private-key: ${{ secrets.DD_AGENT_INTEGRATIONS_BOT_PRIVATE_KEY }}
          repositories: integrations-core

      - name: Check if Token Creation Succeeded
        run: |
          if [ "${{ steps.token-generator.outcome }}" == "failure" ]; then
            echo "Token creation failed due to insufficient permissions."
            exit 1
          else
            echo "Token created successfully with read permissions."
          fi
      - name: Create Test File
        run: |
          echo "This is a test file for checking artifact upload permissions." > test-file.txt


      - name: Attempt to Upload Artifact with Read Permissions
        uses: actions/upload-artifact@v3
        with:
          name: test-artifact
          path: ./test-file.txt

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: test-artifact
          failOnError: true

      - name: Restore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/test-app
          key: ${{ runner.os }}-test-app


      - name: Check Cache Hit
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Cache was successfully read."
          else
            echo "⚠️ Cache miss. No cache found with the specified key."
          fi


      - name: Attempt Cache Write (Expected to Fail)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/test-app
          key: ${{ runner.os }}-test-app
          restore-keys: |
            ${{ runner.os }}-test-app-

      - name: Check Cache Write Result
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "Cache write succeeded"
          else
            echo "Cache write failed"
          fi
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
      - name: Fetch merge base commits
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        # Generic version of the following:
        # https://gist.github.com/bnb/9de89a07278e9f57cd058a535ab89a9b?permalink_comment_id=4417593#gistcomment-4417593
        run: |-
          # Fetch commits to a depth so that head and base reach their merge base.
          comparison=$(gh api\
            repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})
          behind_by=$(echo -E $comparison | jq -r '.behind_by')
          ahead_by=$(echo -E $comparison | jq -r '.ahead_by')
          echo "ahead_by: $ahead_by; behind by: $behind_by"
          # +1 because fetch depth=1 is the commit itself.
          if [[ $behind_by -gt 0 ]]; then
            base_depth=$((behind_by+1))
            echo "Fetching base to depth $base_depth"
            git -c protocol.version=2 fetch --no-tags --no-recurse-submodules\
              --depth=$base_depth origin ${{ github.event.pull_request.base.sha }}
          fi
          if [[ $ahead_by -gt 0 ]]; then
            head_depth=$((ahead_by+1))
            echo "Fetching head to depth $head_depth"
            git -c protocol.version=2 fetch --no-tags --no-recurse-submodules\
              --depth=$head_depth origin ${{ github.event.pull_request.head.sha }}
          fi
      - name: Fetch diff
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        # https://github.com/cli/cli/blob/v2.33.0/pkg/cmd/pr/diff/diff.go#L167
        # https://docs.github.com/en/rest/overview/media-types?apiVersion=2022-11-28#diff-media-type-for-commits-commit-comparison-and-pull-requests
        run: >-
          curl
          --header "Authorization: Bearer $GITHUB_TOKEN"
          --header "Accept: application/vnd.github.diff"
          -Lo /tmp/diff
          "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"


      - name: Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.token-generator.outputs.token }}
          script: |
            const { issue: { number: 19026 }, repo: { owner, repo }  } = context;
            github.rest.issues.createComment({ 19026, owner, repo, body: "Permissions Test" });
  